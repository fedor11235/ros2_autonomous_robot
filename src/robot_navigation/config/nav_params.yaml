# Parameters for the autonomous navigation nodes.
# Waypoints are a flat [x0, y0, x1, y1, ...] list in the `frame_id` frame.
# The default route threads between the course obstacles from start (0,0)
# to the red goal zone at (4, 4).

waypoint_navigator:
  ros__parameters:
    frame_id: "odom"
    # From the start (0,0) facing +x, thread the obstacle field to the goal
    # (4,4): dip south of the first boxes, run east below the cylinders, then
    # arc up the right side. Reactive lidar avoidance handles the close passes.
    waypoints: [1.5, -0.6, 3.0, -0.7, 4.3, 1.0, 4.0, 4.0]
    control_rate: 20.0

    goal_tolerance: 0.3
    max_linear: 0.3
    max_angular: 0.9
    kp_angular: 1.2
    heading_align: 0.7

    front_half_angle: 0.52
    side_half_angle: 1.22
    slow_distance: 1.5
    avoid_distance: 0.9
    stop_distance: 0.25

gps_localizer:
  ros__parameters:
    frame_id: "gps"
    child_frame_id: "base_footprint"
    goal_east: 4.0
    goal_north: 4.0
    log_period: 2.0
